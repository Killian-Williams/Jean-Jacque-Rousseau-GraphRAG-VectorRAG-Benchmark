name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check prompts, benchmark IDs, summaries, and release fingerprints
        run: python scripts/check_repository.py
      - name: Verify regression checks reject damaged fixtures
        run: python -m unittest discover -s tests -v
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Prepare and validate identical corpus inputs
        run: |
          python scripts/prepare_data.py
          python scripts/prepare_data.py --check
          python "RAG application/ingest.py" --dry-run
          python scripts/experiment.py create --run-id ci-offline
      - name: Check GraphRAG CLI without API calls
        run: python -m graphrag index --help
