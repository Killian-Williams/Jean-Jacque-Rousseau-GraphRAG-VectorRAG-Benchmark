name: Offline repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check prompts, benchmark IDs, summaries, and release fingerprints
        run: python scripts/check_repository.py
      - name: Verify regression checks reject damaged fixtures
        run: python -m unittest discover -s tests -v
